services:
  motel-mysql:
    image: mysql:8.4
    container_name: motel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: motel_db
      MYSQL_USER: motel_user
      MYSQL_PASSWORD: motel_password
    ports:
      - "3307:3306"
    volumes:
      - motel_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: motel-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      motel-mysql:
        condition: service_healthy

volumes:
  motel_mysql_data:
