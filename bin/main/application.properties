# Motel Management System demo database
micronaut.application.name=motel-management-system
micronaut.openapi.views.spec=swagger-ui.enabled=true,swagger-ui.theme=flattop
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
micronaut.router.static-resources.swagger.mapping=/swagger/**
datasources.default.url=jdbc:mysql://localhost:3307/motel_db
datasources.default.driver-class-name=com.mysql.cj.jdbc.Driver
datasources.default.username=motel_user
datasources.default.password=motel_password
datasources.default.dialect=MYSQL
jpa.default.properties.hibernate.hbm2ddl.auto=update
jpa.default.properties.hibernate.show_sql=true
jpa.default.entity-scan.packages=com.motel.domain
micronaut.server.cors.enabled=true
micronaut.server.cors.configurations.web.allowed-origins[0]=http://localhost:5173
micronaut.server.cors.configurations.web.allowed-methods[0]=GET
micronaut.server.cors.configurations.web.allowed-methods[1]=POST
micronaut.server.cors.configurations.web.allowed-methods[2]=PUT
micronaut.server.cors.configurations.web.allowed-methods[3]=DELETE
micronaut.server.cors.configurations.web.allowed-headers[0]=Content-Type
